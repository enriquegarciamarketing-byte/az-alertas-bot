name: AZ Value noticias

# Noticias corporativas de las empresas que Enrique lleva en cartera
# (az_value/empresas.yaml), publicadas por el bot de AZ Value en su chat privado.
# Vive en este repo público para poder pasar cada 10 minutos sin gastar minutos de pago.
# Entre la 1:00 y las 7:00 (hora de Madrid) el script no publica.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo mostrar en el log, sin enviar"
        type: boolean
        default: false
      forzar_una:
        description: "Enviar ya la noticia mejor puntuada aunque no llegue al mínimo (prueba)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: az-value-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pyyaml yfinance

      - name: Recordar tu chat con el bot (sin subirlo al repo)
        uses: actions/cache@v4
        with:
          path: az_value/.chat
          key: az-value-chat-${{ github.run_id }}
          restore-keys: az-value-chat-

      - name: Buscar, puntuar y publicar
        env:
          TELEGRAM_VALUE_BOT_TOKEN: ${{ secrets.TELEGRAM_VALUE_BOT_TOKEN }}
          TELEGRAM_VALUE_CHAT_ID: ${{ secrets.TELEGRAM_VALUE_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python az_value/noticias.py ${{ inputs.prueba && '--dry-run' || '' }} ${{ inputs.forzar_una && '--minimo 0 --tope 1 --horas 48' || '' }}

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "az-value-bot"
          git config user.email "az-value-bot@users.noreply.github.com"
          git add az_value/estado.json
          git diff --cached --quiet || { git commit -m "Estado noticias AZ Value $(date +%F-%H%M)" && git pull --rebase && git push; }
