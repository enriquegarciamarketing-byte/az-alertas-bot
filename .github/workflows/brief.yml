name: Brief diario AZ News (respaldo Gemini)

on:
  schedule:
    # Respaldo a las 8.45 en España, por si el brief de Claude no ha llegado. GitHub solo entiende
    # UTC, así que se programa a las 6.45 y 7.45 UTC y el script decide según la hora de España.
    - cron: "45 6,7 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "privado te lo manda a tu chat con el bot, dry no publica (imágenes en Artifacts), test publica ya en el canal, normal como el automático"
        type: choice
        default: privado
        options: [privado, dry, test, normal]

permissions:
  contents: write

concurrency:
  group: brief-diario
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.guardar.outputs.web }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias y fuentes Barlow
        run: |
          pip install -r requirements.txt
          mkdir -p fonts
          for f in Barlow-Black Barlow-Bold Barlow-Medium Barlow-SemiBold; do
            curl -sL -o fonts/$f.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/barlow/$f.ttf"
          done
          curl -sL -o fonts/BarlowCondensed-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-Bold.ttf"

      - name: Redactar, generar tarjetas y publicar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ github.event.inputs.modo || 'normal' }}
        run: python brief.py

      - name: Guardar imágenes y textos del brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_number }}
          path: brief_out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar memoria de briefs publicados
        id: guardar
        if: always()
        run: |
          git config user.name "az-alertas-bot"
          git config user.email "az-alertas-bot@users.noreply.github.com"
          git add brief_state.json
          git add web/gemini_brief 2>/dev/null || true
          if git diff --cached --name-only | grep -q '^web/gemini_brief/'; then echo "web=true" >> "$GITHUB_OUTPUT"; fi
          if ! git diff --cached --quiet; then
            git commit -m "brief $(date -u +%F)" -q
            git pull --rebase -q || true
            git push -q || true
          fi

  web:
    needs: brief
    if: always() && needs.brief.outputs.web == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/web.yml
